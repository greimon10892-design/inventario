<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Kiro — Dulces y Pulseras</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #141414; --surface: #1e1e1e; --border: #2e2e2e; --text: #f0ece6; --orange: #e07b39; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; visibility: hidden; }
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 240px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px; z-index: 100; }
        .content { margin-left: 240px; padding: 20px; }
        .view { display: none; }
        .view.active { display: block; }
        .nav-item { padding: 12px; cursor: pointer; border-radius: 8px; color: #7a7570; }
        .nav-item.active { background: var(--orange); color: white; }
        #splash { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        @media (max-width: 768px) { .sidebar { display: none; } .content { margin-left: 0; } }
    </style>
</head>
<body>
    <div id="splash">
        <h1 style="color:var(--orange)">TALARA</h1>
        <p>Cargando sistema...</p>
    </div>
    <aside class="sidebar">
        <h2 style="color:var(--orange)">KIRO</h2>
        <nav>
            <div class="nav-item active" onclick="navigate('panel')">📊 Panel</div>
            <div class="nav-item" onclick="navigate('productos')">📦 Productos</div>
            <div class="nav-item" onclick="navigate('ventas')">💰 Ventas</div>
            <div class="nav-item" onclick="navigate('movimientos')">🔄 Movimientos</div>
        </nav>
        <div style="position:absolute; bottom:20px;"><div class="nav-item" onclick="fbLogout()">🚪 Salir</div></div>
    </aside>
    <main class="content">
        <section class="view active" id="view-panel"><h1>Panel</h1><div id="stat-products">0</div></section>
        <section class="view" id="view-productos"><h1>Productos</h1><div id="inventory-body"></div></section>
    </main>
    <script src="firebase.js"></script>
    <script src="app.js"></script>
</body>
</html>
