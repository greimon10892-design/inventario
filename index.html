<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>KIRO — Sistema Profesional</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141414; --surface: #1e1e1e; --border: #2e2e2e;
      --text: #f0ece6; --muted: #7a7570; --orange: #e07b39;
      --success: #10b981; --danger: #ef4444; --accent: #e07b39;
    }
    [data-theme="light"] {
      --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0;
      --text: #1e293b; --muted: #64748b;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; min-height: 100vh; overflow-x: hidden; transition: 0.3s; }
    
    /* Sidebar Estilo Premium */
    .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 30px 20px; position: fixed; height: 100vh; z-index: 1000; box-sizing: border-box; }
    .sidebar-brand { margin-bottom: 40px; }
    .brand-title { font-size: 22px; font-weight: 700; color: var(--accent); display: block; }
    .brand-sub { font-size: 11px; color: var(--muted); }
    .content { margin-left: 260px; flex: 1; padding: 40px; padding-bottom: 100px; width: 100%; box-sizing: border-box; }
    
    .nav-item { padding: 12px 16px; cursor: pointer; border-radius: 12px; color: var(--muted); margin-bottom: 6px; transition: 0.2s; display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .nav-item:hover { background: rgba(224, 123, 57, 0.1); color: var(--text); }
    .nav-item.active { background: var(--accent); color: white !important; font-weight: 600; }
    .nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* Cards y Tablas */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 25px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 32px; font-weight: 700; margin-top: 10px; color: var(--text); display: block; }
    
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 16px; overflow: hidden; border: 1px solid var(--border); }
    th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: rgba(0,0,0,0.02); color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .gain-text { color: var(--success); font-weight: 600; }

    /* Navegación Móvil */
    .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); height: 75px; grid-template-columns: repeat(5, 1fr); z-index: 2000; }
    .bnav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: var(--muted); background: none; border: none; cursor: pointer; }
    .bnav-item.active { color: var(--accent); }
    .bnav-item svg { width: 22px; height: 22px; margin-bottom: 4px; stroke: currentColor; fill: none; stroke-width: 2; }

    .view { display: none; } .view.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    #splash { position: fixed; inset: 0; background: #141414; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; transition: 0.5s; }
    .login-card { background: #1e1e1e; padding: 40px; border-radius: 25px; width: 340px; text-align: center; border: 1px solid #2e2e2e; }
    .login-input { width: 100%; padding: 14px; background: #252525; border: 1px solid #333; color: white; border-radius: 12px; margin-bottom: 12px; box-sizing: border-box; }

    @media (max-width: 900px) {
      .sidebar { display: none; } .content { margin-left: 0; padding: 20px; padding-bottom: 100px; }
      .bottom-nav { display: grid; }
    }
  </style>
</head>
<body data-theme="dark">
  <div id="splash"><h1>KIRO</h1><p>Iniciando sistema seguro...</p></div>

  <aside class="sidebar">
    <div class="sidebar-brand"><span class="brand-title">TALARA</span><span class="brand-sub">DULCES & PULSERAS</span></div>
    <nav>
      <div class="nav-item active" onclick="navigate('panel')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Panel</div>
      <div class="nav-item" onclick="navigate('productos')"><svg viewBox="0 0 24 24"><path d="M20 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg> Productos</div>
      <div class="nav-item" onclick="navigate('ventas')"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> Ventas</div>
      <div class="nav-item" onclick="navigate('movimientos')"><svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg> Historial</div>
      <div class="nav-item" onclick="navigate('ajustes')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/></svg> Ajustes</div>
    </nav>
    <div style="position:absolute; bottom:30px; left:20px; right:20px; border-top:1px solid var(--border); padding-top:20px;">
      <div class="nav-item" onclick="fbLogout()" style="opacity:0.5">🚪 Cerrar Sesión</div>
    </div>
  </aside>

  <nav class="bottom-nav">
    <button class="bnav-item active" onclick="navigate('panel')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Panel</button>
    <button class="bnav-item" onclick="navigate('productos')"><svg viewBox="0 0 24 24"><path d="M20 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>Prods</button>
    <button class="bnav-item" onclick="navigate('ventas')"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Ventas</button>
    <button class="bnav-item" onclick="navigate('movimientos')"><svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/></svg>Movs</button>
    <button class="bnav-item" onclick="navigate('ajustes')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>Ajustes</button>
  </nav>

  <main class="content">
    <section class="view active" id="view-panel">
      <h1>Resumen General</h1>
      <div class="stats-grid">
        <div class="stat-card"><span class="stat-label">Stock Total</span><span class="stat-value" id="st-products">0</span></div>
        <div class="stat-card"><span class="stat-label">Inversión</span><span class="stat-value" id="st-investment">$0.00</span></div>
        <div class="stat-card"><span class="stat-label">Ganancia Potencial</span><span class="stat-value" id="st-gain" style="color:var(--success)">$0.00</span></div>
      </div>
    </section>

    <section class="view" id="view-productos">
      <h1>Inventario</h1>
      <table id="table-prods">
        <thead><tr><th>Producto</th><th>Stock</th><th>Compra</th><th>Venta</th><th>Ganancia</th></tr></thead>
        <tbody id="inventory-list"></tbody>
      </table>
    </section>

    <section class="view" id="view-ventas"><h1>Ventas</h1><div id="sale-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap:15px;"></div></section>
    <section class="view" id="view-ajustes">
      <h1>Ajustes</h1>
      <div class="stat-card" style="max-width:400px;">
        <label class="stat-label">Nombre Tienda</label><input type="text" id="set-name" class="login-input" value="TALARA">
        <button class="btn-orange" onclick="alert('Guardado')">Guardar</button>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    const config = {
      apiKey: "AIzaSyDLk5Gu-wY7kb9MdR5UIBtbgJTyFUGAtnA",
      authDomain: "gestor-de-inventario-853d8.firebaseapp.com",
      projectId: "gestor-de-inventario-853d8",
      storageBucket: "gestor-de-inventario-853d8.firebasestorage.app",
      messagingSenderId: "980977651129",
      appId: "1:980977651129:web:791dd31e9b2825c4d57a68"
    };
    firebase.initializeApp(config);
    const db = firebase.firestore();
    let products = [];

    window.navigate = (v) => {
      document.querySelectorAll('.view').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-item, .bnav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('view-' + v)?.classList.add('active');
      document.querySelectorAll(`[onclick="navigate('${v}')"]`).forEach(el => el.classList.add('active'));
    };

    function applySettings(data) {
        // SOLUCIÓN AL ERROR DE TU IMAGEN:
        if (!data) data = { theme: 'dark' }; 
        document.body.setAttribute('data-theme', data.theme || 'dark');
    }

    function renderAll() {
      document.getElementById('st-products').innerText = products.length;
      document.getElementById('inventory-list').innerHTML = products.map(p => `
        <tr><td><strong>${p.name}</strong></td><td>${p.stock}</td><td>$${p.buyPrice}</td><td>$${p.sellPrice}</td><td class="gain-text">$${(p.sellPrice - p.buyPrice).toFixed(2)}</td></tr>
      `).join('');
    }

    firebase.auth().onAuthStateChanged(user => {
      document.getElementById('splash').style.opacity = '0';
      setTimeout(() => document.getElementById('splash').style.display = 'none', 500);
      if (user) {
        document.getElementById('login-screen')?.remove();
        db.collection('products').onSnapshot(snap => {
          products = snap.docs.map(d => ({id: d.id, ...d.data()}));
          renderAll();
        });
        db.collection('settings').doc(user.uid).onSnapshot(doc => applySettings(doc.data()));
      } else { showLogin(); }
    });

    function showLogin() {
      if(document.getElementById('login-screen')) return;
      const ui = `<div id="login-screen"><div class="login-card"><h2>KIRO</h2><input id="em" class="login-input" placeholder="Correo"><input id="pw" type="password" class="login-input" placeholder="Pass"><button onclick="L()" style="width:100%; padding:14px; background:var(--orange); border:none; color:white; font-weight:700; border-radius:12px; cursor:pointer;">Entrar</button></div></div>`;
      document.body.insertAdjacentHTML('beforeend', ui);
    }
    window.L = () => firebase.auth().signInWithEmailAndPassword(document.getElementById('em').value, document.getElementById('pw').value).catch(e => alert(e.message));
    window.fbLogout = () => firebase.auth().signOut().then(() => location.reload());
  </script>
</body>
</html>
