<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIRO — Sistema Profesional</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #141414; --surface: #1e1e1e; --border: #2e2e2e;
            --text: #f0ece6; --muted: #7a7570; --orange: #e07b39;
            --success: #10b981; --danger: #ef4444; --accent: #e07b39;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; min-height: 100vh; overflow-x: hidden; }
        
        /* Sidebar Estilo Foto */
        .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 30px 20px; position: fixed; height: 100vh; z-index: 1000; box-sizing: border-box; }
        .content { margin-left: 260px; flex: 1; padding: 40px; padding-bottom: 100px; width: 100%; box-sizing: border-box; }
        .nav-item { padding: 12px 16px; cursor: pointer; border-radius: 12px; color: var(--muted); margin-bottom: 6px; transition: 0.2s; display: flex; align-items: center; gap: 12px; font-weight: 500; }
        .nav-item:hover { background: #252525; color: var(--text); }
        .nav-item.active { background: var(--accent); color: white; }

        /* Reportes Estilo Foto 1 */
        .report-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 30px 0; }
        .report-stat { border-left: 2px solid var(--border); padding-left: 20px; }
        .stat-val-big { font-size: 24px; font-weight: 700; color: var(--accent); margin-top: 5px; }

        /* Estilo Login Foto 4/5 */
        #login-screen { position:fixed; inset:0; background:#141414; display:flex; align-items:center; justify-content:center; z-index:9999; }
        .login-card { background:#1e1e1e; padding:40px; border-radius:20px; text-align:center; width:340px; border:1px solid #2e2e2e; }
        .login-input { width:100%; padding:14px; margin-bottom:12px; background:#252525; border:1px solid #333; color:white; border-radius:10px; box-sizing:border-box; }
        .btn-login { width:100%; padding:14px; background:var(--accent); border:none; color:white; font-weight:700; border-radius:10px; cursor:pointer; }
        
        table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 16px; overflow: hidden; margin-top: 20px; border: 1px solid var(--border); }
        th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: #252525; color: var(--muted); font-size: 11px; text-transform: uppercase; }
        .gain-text { color: var(--success); font-weight: 600; }
        .prod-img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; background: #333; }
        
        .view { display: none; } .view.active { display: block; }
        #splash { position: fixed; inset: 0; background: #141414; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        @media (max-width: 900px) { .sidebar { display: none; } .content { margin-left: 0; padding: 20px; } }
    </style>
</head>
<body>
    <div id="splash"><h1>KIRO</h1><p>Restaurando sesión...</p></div>

    <aside class="sidebar">
        <div style="margin-bottom: 40px;"><h2 style="color:var(--accent); margin:0;">TALARA</h2><p style="margin:0; font-size:11px; color:var(--muted);">SISTEMA DE GESTIÓN</p></div>
        <div class="nav-item active" onclick="navigate('panel')">📊 Panel</div>
        <div class="nav-item" onclick="navigate('productos')">📦 Productos</div>
        <div class="nav-item" onclick="navigate('movimientos')">🔄 Movimientos</div>
        <div class="nav-item" onclick="navigate('nuevo')">➕ Nuevo Producto</div>
        <div class="nav-item" onclick="navigate('usuarios')">👥 Usuarios</div>
        <div class="nav-item" onclick="navigate('ventas')">💰 Ventas</div>
        <div class="nav-item" onclick="navigate('ajustes')">⚙️ Ajustes</div>
        <div style="position:absolute; bottom:30px; left:20px; right:20px;" onclick="fbLogout()"><div class="nav-item" style="opacity:0.5">🚪 Cerrar Sesión</div></div>
    </aside>

    <main class="content">
        <!-- PRODUCTOS -->
        <section class="view" id="view-productos">
            <h1>Inventario</h1>
            <table>
                <thead><tr><th>Foto</th><th>Producto</th><th>Stock</th><th>Compra</th><th>Venta</th><th>Ganancia</th></tr></thead>
                <tbody id="inventory-list"></tbody>
            </table>
        </section>

        <!-- PANEL -->
        <section class="view active" id="view-panel">
            <h1>Hola de nuevo, Robert 👋</h1>
            <div class="report-grid">
                <div class="report-stat"><div class="stat-label">Productos</div><div class="stat-val-big" id="stat-products">0</div></div>
                <div class="report-stat"><div class="stat-label">Inversión</div><div class="stat-val-big" id="stat-investment">$0.00</div></div>
                <div class="report-stat"><div class="stat-label">Ganancia</div><div class="stat-val-big" style="color:var(--success)" id="stat-potential">$0.00</div></div>
            </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const config = {
            apiKey: "AIzaSyDLk5Gu-wY7kb9MdR5UIBtbgJTyFUGAtnA",
            authDomain: "gestor-de-inventario-853d8.firebaseapp.com",
            projectId: "gestor-de-inventario-853d8",
            storageBucket: "gestor-de-inventario-853d8.firebasestorage.app",
            messagingSenderId: "980977651129",
            appId: "1:980977651129:web:791dd31e9b2825c4d57a68"
        };
        firebase.initializeApp(config);
        const db = firebase.firestore();
        let products = [];

        window.navigate = (view) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('view-' + view)?.classList.add('active');
            event?.currentTarget?.classList.add('active');
        };

        function renderAll() {
            document.getElementById('stat-products').textContent = products.length;
            document.getElementById('inventory-list').innerHTML = products.map(p => `
                <tr>
                    <td><img src="${p.img || ''}" class="prod-img"></td>
                    <td><strong>${p.name}</strong></td>
                    <td>${p.stock}</td>
                    <td>$${p.buyPrice}</td>
                    <td>$${p.sellPrice}</td>
                    <td class="gain-text">$${(p.sellPrice - p.buyPrice).toFixed(2)}</td>
                </tr>
            `).join('');
        }

        function showLogin() {
            if(document.getElementById('login-screen')) return;
            const ui = `
            <div id="login-screen">
                <div class="login-card">
                    <h2>KIRO</h2>
                    <p style="color:var(--muted); font-size:12px; margin-bottom:25px;">Dulces & Pulseras</p>
                    <div id="log-err" style="color:var(--danger); font-size:12px; margin-bottom:10px; display:none;"></div>
                    <input id="em" class="login-input" placeholder="Tu correo Gmail">
                    <input id="pw" type="password" class="login-input" placeholder="Contraseña de esta App">
                    <button id="btn-entrar" onclick="L()" class="btn-login">Entrar</button>
                    <p style="margin-top:20px; font-size:13px; color:var(--muted);">
                        ¿Primera vez? <span style="color:var(--accent); cursor:pointer;" onclick="toggleReg(true)">Crear cuenta</span>
                    </p>
                </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', ui);
        }

        window.toggleReg = (show) => {
            const card = document.querySelector('.login-card');
            if(show) {
                card.innerHTML = `
                <h2>Crear Cuenta</h2>
                <p style="color:var(--muted); font-size:11px; margin-bottom:20px;">Usa tu Gmail y crea una contraseña para esta app.</p>
                <input id="reg-name" class="login-input" placeholder="Tu nombre completo">
                <input id="em" class="login-input" placeholder="Correo Gmail">
                <input id="pw" type="password" class="login-input" placeholder="Nueva contraseña (mín. 6 carac.)">
                <button onclick="R()" class="btn-login">Crear cuenta</button>
                <p style="margin-top:20px; font-size:13px; color:var(--muted);" onclick="location.reload()">Regresar al login</p>`;
            }
        };

        window.L = () => {
            const b = document.getElementById('btn-entrar'); b.innerText = "Entrando...";
            firebase.auth().signInWithEmailAndPassword(document.getElementById('em').value, document.getElementById('pw').value)
            .catch(e => { alert("Error: " + e.message); b.innerText = "Entrar"; });
        };

        window.R = () => {
            const email = document.getElementById('em').value;
            const pass = document.getElementById('pw').value;
            const name = document.getElementById('reg-name').value;
            firebase.auth().createUserWithEmailAndPassword(email, pass).then(cred => {
                return db.collection('users').doc(cred.user.uid).set({ id: cred.user.uid, name, email, role: 'Admin', createdAt: new Date().toISOString() });
            }).catch(e => alert(e.message));
        };

        firebase.auth().onAuthStateChanged(user => {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => document.getElementById('splash').style.display = 'none', 500);
            if (user) {
                document.getElementById('login-screen')?.remove();
                db.collection('products').onSnapshot(snap => {
                    products = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    renderAll();
                });
            } else { showLogin(); }
        });

        window.fbLogout = () => firebase.auth().signOut().then(() => location.reload());
    </script>
</body>
</html>
